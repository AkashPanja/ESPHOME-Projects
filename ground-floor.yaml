esphome:
  name: ground-floor
  friendly_name: Ground Floor

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

api:
  encryption:
    key: !secret groundfloorkey
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret groundfloorotakey

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 5min

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "GroundFloor Fallback Hotspot"
    password: !secret wifi_password
    ap_timeout: 0s


captive_portal:

text_sensor:
  - platform: version
    name: "Ground Floor Dashboard"
  - platform: template
    name: "Ground Floor Dashboard Name"
    lambda: |-
      return {"Ground Floor Dashboard"};
    update_interval: 5min

web_server:
  port: 80
    
switch:
 - platform: shutdown
   name: "Ground Floor Shutdown"
    
 - platform: restart
   id: restart1
   name: "Ground Floor Restart"

 - platform: gpio
   name: "Ground Water Pump"
   icon: "mdi:water"
   id: gwp
   restore_mode: ALWAYS_OFF
   pin:
    number: 18
    inverted: true

 - platform: gpio
   name: "Supply Water Pump"
   icon: "mdi:water"
   id: swp
   restore_mode: ALWAYS_OFF
   pin:
    number: 19
    inverted: true
    
 - platform: gpio
   name: "Main Gate Light"
   icon: "mdi:lightbulb"
   id: MGL
   restore_mode: ALWAYS_OFF 
   pin:
    number: 16
    inverted: true
    
binary_sensor:
  - platform: gpio
    name: "Main Gate Light Switch"
    pin:
      number: 05
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - delay: 500ms
        - switch.turn_on: MGL        
    on_release:
      then:
        - delay: 500ms
        - switch.turn_off: MGL